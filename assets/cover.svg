<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title description">
  <title id="title">favorite-design — 让风景、叙事与交互相遇</title>
  <desc id="description">原创概念头图。深蓝底、浅青与暖色层纸、完整白色羽形线稿及稳定的文字层，表示美术、叙事与交互之间的关系；没有游戏人物或场景素材。</desc>
